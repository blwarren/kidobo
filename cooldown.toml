# Keep the existing lockfile as the minimum version floor and restore it if an
# update cannot produce a graph whose registry releases have aged long enough.
[cooldown]
incompatible-publish-age = "deny"
lockfile-baseline = "floor"

[registry]
global-min-publish-age = "7 days"

# RUSTSEC-2026-0592 blocks release validation. The first patched url release
# requires form_urlencoded 1.2.3. Remove both entries after 2026-11-27 23:03:07 UTC.
[[allow.exact]]
crate = "url"
version = "2.5.9"

[[allow.exact]]
crate = "form_urlencoded"
version = "1.2.3"
