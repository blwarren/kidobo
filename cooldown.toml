# Keep the existing lockfile as the minimum version floor and restore it if an
# update cannot produce a graph whose registry releases have aged long enough.
[cooldown]
incompatible-publish-age = "deny"
lockfile-baseline = "floor"

[registry]
global-min-publish-age = "7 days"

# Accept the replacement for yanked 0.8.3 without relaxing other cooldowns.
[[allow.exact]]
crate = "yoke-derive"
version = "0.8.4"
