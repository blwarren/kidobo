name: mutation

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-mutants:
    name: cargo-mutants ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1/4
            artifact: mutants-out-1-of-4
          - shard: 2/4
            artifact: mutants-out-2-of-4
          - shard: 3/4
            artifact: mutants-out-3-of-4
          - shard: 4/4
            artifact: mutants-out-4-of-4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.93.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run mutation tests
        run: ./scripts/dev.sh ci-mutants --shard "${{ matrix.shard }}"

      - name: Upload mutation results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.artifact }}
          path: mutants.out
