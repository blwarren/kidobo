name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

env:
  JUST_VERSION: 1.55.1
  CARGO_LLVM_COV_VERSION: 0.8.4

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.93.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install just
        run: cargo install --locked just --version "${JUST_VERSION}"

      - name: Install CI tools
        run: just _install-deny _install-audit _install-coverage

      - name: Run CI checks
        run: just verify-release
